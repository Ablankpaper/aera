name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all build jobs but skip publish (no tag, no GitHub Release)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.check.outputs.exists }}
      is_dry_run: ${{ steps.mode.outputs.is_dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: v$VERSION"

      - name: Check if tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute dry-run flag
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "is_dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Dry run: builds will run, publish will be skipped."
          else
            echo "is_dry_run=false" >> "$GITHUB_OUTPUT"
            echo "Real release: publish will run if tag does not exist."
          fi

  release_mac:
    name: Build macOS (arm64)
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare locked AgentEra Runtime Seed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run prepare:runtime-seed -- --platform darwin --arch arm64

      - name: Rebuild native dependencies for target arch
        run: npx electron-builder install-app-deps --arch=arm64

      - name: Build app
        env:
          VITE_ANALYTICS_BASE_URL: ${{ vars.VITE_ANALYTICS_BASE_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
          MAIN_VITE_HERMES_API_URL: ${{ vars.HERMES_API_URL }}
          MAIN_VITE_HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        run: npm run build

      - name: Stage App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_API_KEY_BASE64:-}" ]; then
            echo "ASC_API_KEY secret is missing — notarization will fail." >&2
            exit 1
          fi
          KEY_DIR="$RUNNER_TEMP/appstore"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Package macOS artifacts
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: npx electron-builder --mac dmg zip --arm64 --publish never

      - name: Verify Runtime Seed in unpacked app
        run: |
          set -euo pipefail
          SEED="dist/mac-arm64/AgentEra Studio.app/Contents/Resources/agentera-runtime-seed"
          if [ ! -d "$SEED" ]; then
            SEED="dist/mac/AgentEra Studio.app/Contents/Resources/agentera-runtime-seed"
          fi
          npm run verify:packaged-runtime-seed -- "$SEED" \
            --reference-dir resources/agentera-runtime-seed

      - name: Verify Runtime Seed in final macOS artifacts
        run: |
          set -euo pipefail
          REFERENCE="$PWD/resources/agentera-runtime-seed"
          ZIP_PATH=$(find dist -maxdepth 1 -type f -name '*-arm64-mac.zip' -print -quit)
          DMG_PATH=$(find dist -maxdepth 1 -type f -name '*-arm64.dmg' -print -quit)
          test -n "$ZIP_PATH"
          test -n "$DMG_PATH"

          ZIP_ROOT=$(mktemp -d)
          ditto -x -k "$ZIP_PATH" "$ZIP_ROOT"
          ZIP_SEED=$(find "$ZIP_ROOT" -type d -path '*/Contents/Resources/agentera-runtime-seed' -print -quit)
          test -n "$ZIP_SEED"
          npm run verify:packaged-runtime-seed -- "$ZIP_SEED" \
            --reference-dir "$REFERENCE"

          MOUNT_ROOT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_ROOT" "$DMG_PATH"
          trap 'hdiutil detach "$MOUNT_ROOT" || true; rm -rf "$ZIP_ROOT" "$MOUNT_ROOT"' EXIT
          DMG_SEED=$(find "$MOUNT_ROOT" -type d -path '*/Contents/Resources/agentera-runtime-seed' -print -quit)
          test -n "$DMG_SEED"
          npm run verify:packaged-runtime-seed -- "$DMG_SEED" \
            --reference-dir "$REFERENCE"
          hdiutil detach "$MOUNT_ROOT"
          trap - EXIT
          rm -rf "$ZIP_ROOT" "$MOUNT_ROOT"

      - name: Verify native module architecture
        run: |
          set -euo pipefail
          NODE_FILE="dist/mac-arm64/AgentEra Studio.app/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if [ ! -f "$NODE_FILE" ]; then
            NODE_FILE="dist/mac/AgentEra Studio.app/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          fi
          file "$NODE_FILE"
          file "$NODE_FILE" | grep -q "arm64"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap

  release_windows:
    name: Build Windows
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare locked AgentEra Runtime Seed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run prepare:runtime-seed -- --platform windows --arch x64

      - name: Build app
        env:
          VITE_ANALYTICS_BASE_URL: ${{ vars.VITE_ANALYTICS_BASE_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
          MAIN_VITE_HERMES_API_URL: ${{ vars.HERMES_API_URL }}
          MAIN_VITE_HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        run: npm run build

      - name: Package Windows artifacts
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Verify Runtime Seed in unpacked app
        shell: pwsh
        run: >-
          npm run verify:packaged-runtime-seed --
          "dist/win-unpacked/resources/agentera-runtime-seed"
          --reference-dir "resources/agentera-runtime-seed"

      - name: Verify Runtime Seed in final Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reference = (Resolve-Path "resources/agentera-runtime-seed").Path
          $artifacts = @(Get-ChildItem "dist" -File -Filter "*.exe")
          if ($artifacts.Count -ne 2) {
            throw "Expected NSIS and portable executables, found $($artifacts.Count)"
          }
          foreach ($artifact in $artifacts) {
            $root = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Path $root | Out-Null
            & 7z x -y "-o$root" $artifact.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z could not inspect $($artifact.Name)" }
            $seed = Get-ChildItem $root -Directory -Recurse -Filter "agentera-runtime-seed" | Select-Object -First 1
            if (-not $seed) {
              foreach ($nested in @(Get-ChildItem $root -File -Recurse -Filter "*.7z")) {
                $nestedRoot = "$($nested.FullName).unpacked"
                New-Item -ItemType Directory -Path $nestedRoot | Out-Null
                & 7z x -y "-o$nestedRoot" $nested.FullName | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "7z could not inspect $($nested.Name)" }
              }
              $seed = Get-ChildItem $root -Directory -Recurse -Filter "agentera-runtime-seed" | Select-Object -First 1
            }
            if (-not $seed) { throw "Runtime Seed missing from $($artifact.Name)" }
            npm run verify:packaged-runtime-seed -- $seed.FullName --reference-dir $reference
            if ($LASTEXITCODE -ne 0) { throw "Runtime Seed verification failed for $($artifact.Name)" }
            Remove-Item $root -Recurse -Force
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  generate_winget:
    name: Generate winget manifests
    needs: [prepare, release_windows]
    if: needs.prepare.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist/

      - name: Generate winget manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_OWNER: bignormal
        run: node scripts/generate-winget-manifests.mjs

      - name: Upload winget manifests artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ needs.prepare.outputs.version }}
          path: dist/winget/

  publish:
    name: Publish Release
    needs: [prepare, release_mac, release_windows, generate_winget]
    if: needs.prepare.outputs.is_dry_run == 'false' && needs.prepare.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.prepare.outputs.tag }}
          git push origin ${{ needs.prepare.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate macOS update metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");

          const artifactsDir = path.join(process.cwd(), "artifacts");
          const version = process.env.VERSION;
          const zipNames = fs
            .readdirSync(artifactsDir)
            .filter(
              (name) =>
                name.startsWith(`agentera-studio-${version}-`) &&
                name.endsWith("-arm64-mac.zip"),
            );

          if (
            zipNames.length !== 1 ||
            !zipNames[0].includes("-arm64-")
          ) {
            throw new Error(
              `Expected one arm64 macOS zip, found: ${zipNames.join(", ")}`,
            );
          }

          const files = zipNames.map((name) => {
            const filePath = path.join(artifactsDir, name);
            return {
              url: name,
              sha512: crypto
                .createHash("sha512")
                .update(fs.readFileSync(filePath))
                .digest("base64"),
              size: fs.statSync(filePath).size,
            };
          });
          const primary = files[0];
          const releaseDate = new Date().toISOString();
          const lines = [
            `version: ${version}`,
            "files:",
            ...files.flatMap((file) => [
              `  - url: ${file.url}`,
              `    sha512: ${file.sha512}`,
              `    size: ${file.size}`,
            ]),
            `path: ${primary.url}`,
            `sha512: ${primary.sha512}`,
            `releaseDate: '${releaseDate}'`,
            "",
          ];

          fs.writeFileSync(path.join(artifactsDir, "latest-mac.yml"), lines.join("\n"));
          NODE

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: AgentEra Studio ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/latest.yml
            artifacts/latest-mac.yml
