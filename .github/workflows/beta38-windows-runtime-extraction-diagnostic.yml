name: Beta.38 Windows Runtime extraction-only diagnostic

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Desktop source SHA to package for the extraction boundary
        required: true
        type: string

permissions:
  contents: read

# This workflow is evidence-only. It does not install the Runtime through
# Electron, start Gateway, use the internal-Beta environment, or touch release
# signing/promotion paths. The verified Seed archive is extracted into fresh
# run-owned temporary directories and removed after each variant.
concurrency:
  group: beta38-windows-runtime-extraction-diagnostic-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 Runtime extraction boundary
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      MAIN_VITE_AGENTERA_CLOUD_PUBLIC_URL: https://127.0.0.1
      MAIN_VITE_AGENTERA_OFFLINE_PUBLIC_KEYS_JSON: >-
        {"issuer":"https://127.0.0.1","keys":[{"keyId":"diagnostic-v1","publicKey":"C1E62bSSQBXKCQLtB5BE06xdvsIwbwaUjBDajrbjny0"}]}
      MAIN_VITE_HERMES_API_URL: https://127.0.0.1

    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and Beta.38 identity
        shell: pwsh
        run: |
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'source_sha must be a full lowercase commit SHA'
          }
          if ((git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA) {
            throw 'Checked out source differs from source_sha'
          }
          if ((node -p "require('./package.json').version").Trim() -cne '0.7.4-internal-beta.38') {
            throw 'Unexpected Desktop version'
          }

      - name: Require native Windows x64 runner
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -cne 'X64' -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Diagnostic requires native Windows x64 ($architecture/$env:PROCESSOR_ARCHITECTURE)"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare the exact locked Runtime Seed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run prepare:runtime-seed -- --platform windows --arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package an unsigned unpacked Electron app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder `
            --config build/electron-builder.internal-beta.yml `
            --win dir --x64 --publish never `
            --config.forceCodeSigning=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare packaged native and sequential extraction boundaries
        shell: pwsh
        run: |
          $unpacked = @(Get-ChildItem dist -Directory | Where-Object { $_.Name -like '*unpacked' })
          if ($unpacked.Count -ne 1) { throw 'Expected exactly one unpacked Windows app' }
          $archive = @(Get-ChildItem resources/agentera-runtime-seed -File -Filter '*.zip')
          if ($archive.Count -ne 1) { throw 'Expected exactly one locked Runtime ZIP' }
          $electron = Join-Path $unpacked[0].FullName 'Aera.exe'
          $nativeModule = Join-Path $unpacked[0].FullName 'resources/app.asar.unpacked/node_modules/@electron-internal/extract-zip/index.js'
          $output = Join-Path $env:RUNNER_TEMP 'beta38-windows-runtime-extraction-diagnostic.jsonl'
          $yauzl = Join-Path $env:GITHUB_WORKSPACE 'node_modules/yauzl/index.js'
          if (-not (Test-Path -LiteralPath $electron -PathType Leaf)) { throw 'Packaged Electron executable is missing' }
          if (-not (Test-Path -LiteralPath $nativeModule -PathType Leaf)) { throw 'Packaged native extractor module is missing' }
          node scripts/diagnose-windows-runtime-extraction.mjs `
            --electron $electron `
            --archive $archive[0].FullName `
            --module $nativeModule `
            --yauzl $yauzl `
            --output $output `
            --timeout-ms 180000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summarize extraction boundary evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'beta38-windows-runtime-extraction-diagnostic.jsonl'
          if (Test-Path -LiteralPath $output -PathType Leaf) {
            Get-Content -LiteralPath $output | Select-String -Pattern 'diagnostic-|variant-' | Select-Object -Last 120
          } else {
            Write-Warning 'Extraction diagnostic evidence is missing'
          }

      - name: Upload extraction boundary evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: beta38-windows-runtime-extraction-diagnostic-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/beta38-windows-runtime-extraction-diagnostic.jsonl
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
