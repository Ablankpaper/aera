name: Prerelease candidate entrypoint

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character Desktop commit SHA
        required: true
        type: string
      ci_run_id:
        description: Successful CI run ID for the exact source SHA
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  candidate:
    name: Build immutable prerelease candidate
    uses: ./.github/workflows/release-candidate.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      ci_run_id: ${{ inputs.ci_run_id }}
    secrets: inherit
