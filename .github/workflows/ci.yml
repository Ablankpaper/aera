name: CI

# Runs the type checker and test suite on every PR and on pushes to main,
# so broken code is caught before it merges. Mirrors the Node version and
# install step already used by release.yml.

on:
  pull_request:
  push:
    branches: [main, "aera/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: full
        type: choice
        options:
          - full
          - windows-process-tree-diagnostic
          - windows-runtime-install-diagnostic

permissions:
  contents: read

env:
  AERA_ENCRYPTED_BACKUP_CLOUD_SHA: da6f96995795eda4b9832adaaf058bc06fd64bef

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test external diagnostic collector on native platform
        env:
          NODE_NO_WARNINGS: "1"
        run: >-
          node --test
          deliveries/beta33-external-diagnostic/*.test.mjs
          scripts/internal-beta/build-diagnostic-target.test.mjs
          scripts/internal-beta/inspect-diagnostic-identity.test.mjs
          scripts/internal-beta/package-diagnostic-collectors.test.mjs
          scripts/internal-beta/workflow-artifact-kinds.test.mjs

      - name: Verify pinned Aera cloud contract
        run: npm run check:agentera-cloud-contract

      - name: Verify official quality privacy boundary
        run: npm run check:official-quality-boundary

      - name: Checkout Cloud privacy boundary
        if: matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: actions/checkout@v4
        with:
          repository: Ablankpaper/aera-cloud
          ref: ${{ env.AERA_ENCRYPTED_BACKUP_CLOUD_SHA }}
          path: .ci/aera-cloud
          token: ${{ secrets.AERA_CROSS_REPO_READ_TOKEN || github.token }}

      - name: Verify exact Cloud privacy boundary source
        if: matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .ci/aera-cloud rev-parse HEAD)" = \
            "$AERA_ENCRYPTED_BACKUP_CLOUD_SHA"

      - name: Verify exact Cloud public contract bytes
        if: matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        env:
          AGENTERA_CLOUD_CONTRACT_SOURCE: ${{ github.workspace }}/.ci/aera-cloud/api/openapi.yaml
        run: npm run check:agentera-cloud-contract

      - name: Verify encrypted backup privacy boundary
        if: matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        env:
          AERA_ENCRYPTED_BACKUP_CLOUD_REPO: ${{ github.workspace }}/.ci/aera-cloud
        run: npm run check:encrypted-backup-boundary

      - name: Audit production dependency tree
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high
        # The migration PR is allowed to continue to code validation while the
        # known extract-zip advisory remains explicitly visible. Keep the
        # production/main gate fail-closed until the compatibility fix lands.
        continue-on-error: ${{ github.head_ref == 'aera/github-owner-migration' || github.ref == 'refs/heads/aera/github-owner-migration' }}

      - name: Typecheck
        run: npm run typecheck

      # Hosted Ubuntu and Windows runners have both dropped a filesystem-heavy
      # Vitest fork, so serialize files there. Windows can also pause individual
      # SQLite/process cases beyond Vitest's 5-second default under runner load.
      - name: Test unit (macOS parallel)
        if: matrix.os == 'macos-latest'
        run: npm test -- --maxWorkers=2

      - name: Test unit (Ubuntu serial)
        if: matrix.os == 'ubuntu-latest'
        run: npm test -- --maxWorkers=1

      - name: Test unit (Windows serial)
        if: matrix.os == 'windows-latest'
        run: npm test -- --maxWorkers=1 --testTimeout=20000

      - name: Test official quality privacy flow
        run: npm run test:e2e:official-quality

      - name: Build
        run: npm run build

      # Lint is informational while the existing cross-project error and
      # formatting backlog is reduced independently from this release gate.
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint
        continue-on-error: true

  windows-model-recovery:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    name: windows-model-recovery
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run bounded process-crash recovery harness
        shell: pwsh
        run: |
          $harnessRoot = Join-Path ([System.IO.Path]::GetTempPath()) ("aera-windows-model-recovery-root-" + [Guid]::NewGuid().ToString("N"))
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "aera-windows-model-recovery-evidence"
          New-Item -ItemType Directory -Force -Path $harnessRoot, $evidenceRoot | Out-Null
          ./scripts/release/windows-model-recovery-harness.ps1 `
            -ProjectRoot $env:GITHUB_WORKSPACE `
            -HarnessRoot $harnessRoot
          Copy-Item `
            (Join-Path $harnessRoot "windows-recovery-evidence.json") `
            (Join-Path $evidenceRoot "windows-recovery-evidence.json")

      - name: Upload bounded recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-model-recovery-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/aera-windows-model-recovery-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-process-tree-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'windows-process-tree-diagnostic'
    name: windows-process-tree-diagnostic
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      AERA_PROCESS_TREE_DIAGNOSTICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Node
        run: npm run typecheck:node

      - name: Test Windows process-tree boundary
        run: >-
          npm test --
          src/main/process-tree.test.ts
          tests/gateway-restart.test.ts
          src/main/tui-gateway-lifecycle.test.ts
          src/main/gateway-shutdown-lifecycle.test.ts
          --maxWorkers=1
          --testTimeout=20000
          --reporter=verbose

  windows-runtime-install-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'windows-runtime-install-diagnostic'
    name: windows-runtime-install-diagnostic
    runs-on: windows-2025
    environment: internal-beta
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare and verify locked Windows Runtime Seed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.AERA_CROSS_REPO_READ_TOKEN || github.token }}
        run: |
          npm run prepare:runtime-seed -- --platform windows --arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:packaged-runtime-seed -- `
            resources/agentera-runtime-seed `
            --desktop-version "0.7.4-internal-beta.38"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure locked Runtime Seed installation
        shell: pwsh
        env:
          AGENTERA_RUNTIME_INSTALL_DIAGNOSTIC: "1"
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "runtime-install-diagnostic"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $env:AGENTERA_RUNTIME_SEED_DIR = Join-Path $env:GITHUB_WORKSPACE "resources/agentera-runtime-seed"
          $env:AGENTERA_RUNTIME_INSTALL_DIAGNOSTIC_OUTPUT = Join-Path $evidence "events.jsonl"
          npx vitest run tests/runtime-seed-install-live-diagnostic.test.ts `
            --maxWorkers=1 `
            --testTimeout=420000 `
            --reporter=verbose 2>&1 | Tee-Object -FilePath (Join-Path $evidence "vitest.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probe packaged Electron Runtime installation
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          VITE_ANALYTICS_BASE_URL: ${{ vars.VITE_ANALYTICS_BASE_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
          MAIN_VITE_HERMES_API_URL: ${{ vars.HERMES_API_URL }}
          MAIN_VITE_HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          MAIN_VITE_AGENTERA_CLOUD_PUBLIC_URL: ${{ vars.AERA_INTERNAL_BETA_ORIGIN }}
          MAIN_VITE_AGENTERA_OFFLINE_PUBLIC_KEYS_JSON: >-
            {"issuer":"${{ vars.AERA_INTERNAL_BETA_ORIGIN }}","keys":[{"keyId":"${{ vars.AERA_INTERNAL_BETA_OFFLINE_KEY_ID }}","publicKey":"${{ vars.AERA_INTERNAL_BETA_OFFLINE_PUBLIC_KEY }}"}]}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MAIN_VITE_AGENTERA_CLOUD_PUBLIC_URL)) {
            throw "Internal Beta Cloud origin is missing"
          }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder `
            --config build/electron-builder.internal-beta.yml `
            --win dir --x64 --publish never `
            --config.forceCodeSigning=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unpacked = @(Get-ChildItem dist -Directory | Where-Object { $_.Name -like "*unpacked" })
          if ($unpacked.Count -ne 1) { throw "Expected exactly one unpacked Windows app" }
          $evidence = Join-Path $env:RUNNER_TEMP "runtime-install-diagnostic"
          $env:AGENTERA_E2E_EXECUTABLE_PATH = Join-Path $unpacked[0].FullName "Aera.exe"
          $env:AGENTERA_RUNTIME_SEED_DIR = Join-Path $unpacked[0].FullName "resources/agentera-runtime-seed"
          $env:AGENTERA_E2E_RUNTIME_CONTRACT_OUTPUT = Join-Path $evidence "packaged-runtime-contract.json"
          $env:AGENTERA_E2E_RUNTIME_CONTRACT_DIAGNOSTIC_OUTPUT = Join-Path $evidence "packaged-events.jsonl"
          $env:AGENTERA_RUNTIME_INVENTORY_DIAGNOSTIC_OUTPUT = Join-Path $evidence "inventory-events.jsonl"
          $env:AGENTERA_E2E_SOURCE_SHA = "${{ github.sha }}"
          npx playwright test tests/e2e/agentera-runtime-contract.e2e.ts 2>&1 | `
            Tee-Object -FilePath (Join-Path $evidence "packaged-playwright.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload bounded Runtime install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-install-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/runtime-install-diagnostic
            test-results
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
