name: CI

# Runs the type checker and test suite on every PR and on pushes to main,
# so broken code is caught before it merges. Mirrors the Node version and
# install step already used by release.yml.

on:
  pull_request:
  push:
    branches: [main, "aera/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: full
        type: choice
        options:
          - full
          - windows-process-tree-diagnostic
          - windows-managed-gateway-diagnostic
          - windows-runtime-health-diagnostic

permissions:
  contents: read

env:
  AERA_ENCRYPTED_BACKUP_CLOUD_SHA: da6f96995795eda4b9832adaaf058bc06fd64bef

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test external diagnostic collector on native platform
        env:
          NODE_NO_WARNINGS: "1"
        run: >-
          node --test
          deliveries/beta33-external-diagnostic/*.test.mjs
          scripts/internal-beta/build-diagnostic-target.test.mjs
          scripts/internal-beta/inspect-diagnostic-identity.test.mjs
          scripts/internal-beta/package-diagnostic-collectors.test.mjs
          scripts/internal-beta/workflow-artifact-kinds.test.mjs

      - name: Test managed Gateway diagnostic contract
        run: node --test scripts/diagnose-windows-serve-help.test.mjs

      - name: Verify pinned Aera cloud contract
        run: npm run check:agentera-cloud-contract

      - name: Verify official quality privacy boundary
        run: npm run check:official-quality-boundary

      - name: Checkout Cloud privacy boundary
        if: matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: actions/checkout@v4
        with:
          repository: Ablankpaper/aera-cloud
          ref: ${{ env.AERA_ENCRYPTED_BACKUP_CLOUD_SHA }}
          path: .ci/aera-cloud
          token: ${{ secrets.AERA_CROSS_REPO_READ_TOKEN || github.token }}

      - name: Verify exact Cloud privacy boundary source
        if: matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .ci/aera-cloud rev-parse HEAD)" = \
            "$AERA_ENCRYPTED_BACKUP_CLOUD_SHA"

      - name: Verify exact Cloud public contract bytes
        if: matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        env:
          AGENTERA_CLOUD_CONTRACT_SOURCE: ${{ github.workspace }}/.ci/aera-cloud/api/openapi.yaml
        run: npm run check:agentera-cloud-contract

      - name: Verify encrypted backup privacy boundary
        if: matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        env:
          AERA_ENCRYPTED_BACKUP_CLOUD_REPO: ${{ github.workspace }}/.ci/aera-cloud
        run: npm run check:encrypted-backup-boundary

      - name: Audit production dependency tree
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high
        # The migration PR is allowed to continue to code validation while the
        # known extract-zip advisory remains explicitly visible. Keep the
        # production/main gate fail-closed until the compatibility fix lands.
        continue-on-error: ${{ github.head_ref == 'aera/github-owner-migration' || github.ref == 'refs/heads/aera/github-owner-migration' }}

      - name: Typecheck
        run: npm run typecheck

      # Hosted Ubuntu and Windows runners have both dropped a filesystem-heavy
      # Vitest fork, so serialize files there. Windows can also pause individual
      # SQLite/process cases beyond Vitest's 5-second default under runner load.
      - name: Test unit (macOS parallel)
        if: matrix.os == 'macos-latest'
        run: npm test -- --maxWorkers=2

      - name: Test unit (Ubuntu serial)
        if: matrix.os == 'ubuntu-latest'
        run: npm test -- --maxWorkers=1

      - name: Test unit (Windows serial)
        if: matrix.os == 'windows-latest'
        run: npm test -- --maxWorkers=1 --testTimeout=20000

      - name: Test official quality privacy flow
        run: npm run test:e2e:official-quality

      - name: Build
        run: npm run build

      # Lint is informational while the existing cross-project error and
      # formatting backlog is reduced independently from this release gate.
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint
        continue-on-error: true

  windows-model-recovery:
    name: windows-model-recovery
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run bounded process-crash recovery harness
        shell: pwsh
        run: |
          $harnessRoot = Join-Path ([System.IO.Path]::GetTempPath()) ("aera-windows-model-recovery-root-" + [Guid]::NewGuid().ToString("N"))
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "aera-windows-model-recovery-evidence"
          New-Item -ItemType Directory -Force -Path $harnessRoot, $evidenceRoot | Out-Null
          ./scripts/release/windows-model-recovery-harness.ps1 `
            -ProjectRoot $env:GITHUB_WORKSPACE `
            -HarnessRoot $harnessRoot
          Copy-Item `
            (Join-Path $harnessRoot "windows-recovery-evidence.json") `
            (Join-Path $evidenceRoot "windows-recovery-evidence.json")

      - name: Upload bounded recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-model-recovery-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/aera-windows-model-recovery-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-process-tree-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'windows-process-tree-diagnostic'
    name: windows-process-tree-diagnostic
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      AERA_PROCESS_TREE_DIAGNOSTICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Node
        run: npm run typecheck:node

      - name: Test Windows process-tree boundary
        run: >-
          npm test --
          src/main/process-tree.test.ts
          tests/gateway-restart.test.ts
          src/main/tui-gateway-lifecycle.test.ts
          src/main/gateway-shutdown-lifecycle.test.ts
          --maxWorkers=1
          --testTimeout=20000
          --reporter=verbose

  windows-managed-gateway-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'windows-managed-gateway-diagnostic'
    name: windows-managed-gateway-diagnostic
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The prepare script and the diagnostic runner are Node-stdlib only;
      # an npm ci here would add minutes without changing either tool.
      - name: Prepare packaged Runtime seed
        run: npm run prepare:runtime-seed -- --platform windows --arch x64

      - name: Extract packaged Runtime seed
        shell: pwsh
        run: |
          $archive = Get-ChildItem resources/agentera-runtime-seed/*.zip | Select-Object -First 1
          if ($null -eq $archive) { throw "Runtime seed archive not found" }
          $manifest = Get-ChildItem resources/agentera-runtime-seed/*.manifest.json | Select-Object -First 1
          if ($null -eq $manifest) { throw "Runtime seed manifest not found" }
          $dest = Join-Path $env:RUNNER_TEMP "runtime-seed-extract"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $dest -Force
          "SEED_EXTRACT_ROOT=$dest" >> $env:GITHUB_ENV
          "SEED_MANIFEST=$($manifest.FullName)" >> $env:GITHUB_ENV

      - name: Diagnose the managed Gateway launch path
        run: >-
          node scripts/diagnose-windows-serve-help.mjs
          --runtime-root "$env:SEED_EXTRACT_ROOT"
          --manifest "$env:SEED_MANIFEST"
          --output "$env:RUNNER_TEMP/managed-gateway-diagnostic.jsonl"

      # Controlled comparison against the packaged Desktop boundary: the
      # failing managed spawn spreads the parent environment and routes
      # stderr through an inherited file handle. Reproduce exactly those two
      # dimensions on the same seed so a hang localises to env, stdio, or the
      # Electron parent-process boundary.
      - name: Diagnose the Desktop-equivalent env and stdio boundary
        run: >-
          node scripts/diagnose-windows-serve-help.mjs
          --runtime-root "$env:SEED_EXTRACT_ROOT"
          --manifest "$env:SEED_MANIFEST"
          --env-mode desktop
          --stdio-mode file
          --output "$env:RUNNER_TEMP/controlled-gateway-diagnostic.jsonl"

      - name: Upload managed Gateway diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-managed-gateway-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/managed-gateway-diagnostic.jsonl
            ${{ runner.temp }}/controlled-gateway-diagnostic.jsonl
          if-no-files-found: warn
          retention-days: 14

  windows-runtime-health-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'windows-runtime-health-diagnostic'
    name: windows-runtime-health-diagnostic
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare packaged Runtime seed
        run: npm run prepare:runtime-seed -- --platform windows --arch x64

      - name: Extract packaged Runtime seed
        shell: pwsh
        run: |
          $archive = Get-ChildItem resources/agentera-runtime-seed/*.zip | Select-Object -First 1
          if ($null -eq $archive) { throw "Runtime seed archive not found" }
          $manifest = Get-ChildItem resources/agentera-runtime-seed/*.manifest.json | Select-Object -First 1
          if ($null -eq $manifest) { throw "Runtime seed manifest not found" }
          $destination = Join-Path $env:RUNNER_TEMP "runtime-health-seed"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination -Force
          $runtimeRoot = Join-Path $destination "agentera-runtime"
          if (-not (Test-Path -LiteralPath (Join-Path $runtimeRoot "python") -PathType Container)) {
            throw "Extracted Runtime root is missing"
          }
          "AERA_RUNTIME_HEALTH_ROOT=$runtimeRoot" >> $env:GITHUB_ENV
          "AERA_RUNTIME_HEALTH_MANIFEST=$($manifest.FullName)" >> $env:GITHUB_ENV

      - name: Run extracted Runtime health lifecycle diagnostic
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "runtime-health-diagnostics"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $output = Join-Path $evidence "events.jsonl"
          $env:AERA_RUNTIME_HEALTH_DIAGNOSTIC_OUTPUT = $output
          $env:AGENTERA_E2E_DIAGNOSTICS = "1"
          $env:AGENTERA_E2E_RUNTIME_CONTRACT_DIAGNOSTIC_OUTPUT = $output
          $env:AERA_RUNTIME_HEALTH_TIMEOUT_MS = "120000"
          npm test -- tests/runtime-health-diagnostics.test.ts --run --maxWorkers=1 --testTimeout=180000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Runtime health lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-health-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-health-diagnostics
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
