name: Beta.38 Windows packaged Gateway boundary diagnostic

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Desktop source SHA to diagnose
        required: true
        type: string

permissions:
  actions: read
  contents: read

# This workflow is evidence-only. It deliberately does not use the internal
# Beta environment, signing credentials, candidate assembly, promotion, or
# publication paths. A failing packaged contract is an expected diagnostic
# result; the uploaded trace is the output we need for the next hypothesis.
concurrency:
  group: beta38-windows-packaged-boundary-diagnostic-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 packaged Gateway boundary diagnostic
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      # The packaged app only needs syntactically valid build-time trust data
      # for this local loopback diagnostic. No Cloud/Admin credential is used.
      MAIN_VITE_AGENTERA_CLOUD_PUBLIC_URL: https://127.0.0.1
      MAIN_VITE_AGENTERA_OFFLINE_PUBLIC_KEYS_JSON: >-
        {"issuer":"https://127.0.0.1","keys":[{"keyId":"diagnostic-v1","publicKey":"C1E62bSSQBXKCQLtB5BE06xdvsIwbwaUjBDajrbjny0"}]}
      MAIN_VITE_HERMES_API_URL: https://127.0.0.1

    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and Beta.38 identity
        shell: pwsh
        run: |
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'source_sha must be a full lowercase commit SHA'
          }
          if ((git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA) {
            throw 'Checked out source differs from source_sha'
          }
          if ((node -p "require('./package.json').version").Trim() -cne '0.7.4-internal-beta.38') {
            throw 'Unexpected Desktop version'
          }

      - name: Require native Windows x64 runner
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -cne 'X64' -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Diagnostic requires native Windows x64 ($architecture/$env:PROCESSOR_ARCHITECTURE)"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare locked Runtime Seed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run prepare:runtime-seed -- --platform windows --arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Desktop with diagnostic-only trust data
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package unsigned unpacked Windows app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder `
            --config build/electron-builder.internal-beta.yml `
            --win dir --x64 --publish never `
            --config.forceCodeSigning=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run one packaged Electron Gateway boundary trace
        id: packaged_trace
        continue-on-error: true
        shell: pwsh
        env:
          AGENTERA_E2E_GATEWAY_OBSERVER: disabled
          AGENTERA_E2E_GATEWAY_STARTUP_TRACE: "1"
        run: |
          $unpacked = @(Get-ChildItem dist -Directory | Where-Object { $_.Name -like '*unpacked' })
          if ($unpacked.Count -ne 1) { throw 'Expected exactly one unpacked Windows app' }
          $evidence = Join-Path $env:RUNNER_TEMP 'beta38-windows-packaged-boundary-diagnostic'
          $diagnostics = Join-Path $evidence 'runtime-contract-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          $env:AGENTERA_E2E_EXECUTABLE_PATH = Join-Path $unpacked[0].FullName 'Aera.exe'
          $env:AGENTERA_RUNTIME_SEED_DIR = Join-Path $unpacked[0].FullName 'resources/agentera-runtime-seed'
          $env:AGENTERA_E2E_SOURCE_SHA = $env:SOURCE_SHA
          $env:AGENTERA_E2E_RUNTIME_CONTRACT_OUTPUT = Join-Path $evidence 'packaged-runtime-contract-windows.json'
          $env:AGENTERA_E2E_RUNTIME_CONTRACT_DIAGNOSTIC_OUTPUT = Join-Path $diagnostics 'events.jsonl'
          $env:AGENTERA_RUNTIME_INVENTORY_DIAGNOSTIC_OUTPUT = Join-Path $diagnostics 'inventory-events.jsonl'
          & npx playwright test tests/e2e/agentera-runtime-contract.e2e.ts 2>&1 |
            Tee-Object -FilePath (Join-Path $diagnostics 'playwright.log')
          $exitCode = $LASTEXITCODE
          # The diagnostic must preserve the trace even when the expected
          # readiness contract fails. The following existence checks turn a
          # missing collector into a real job failure without hiding a product
          # failure behind a green contract assertion.
          if (-not (Test-Path -LiteralPath (Join-Path $diagnostics 'events.jsonl') -PathType Leaf)) {
            throw 'Packaged boundary diagnostic events are missing'
          }
          if ($exitCode -ne 0) {
            Write-Host "Packaged contract exited with $exitCode; preserving diagnostic evidence."
          }

      - name: Summarize packaged boundary trace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $events = Join-Path $env:RUNNER_TEMP 'beta38-windows-packaged-boundary-diagnostic/runtime-contract-diagnostics/events.jsonl'
          if (Test-Path -LiteralPath $events -PathType Leaf) {
            Get-Content -LiteralPath $events | Select-String -Pattern 'gateway-(invoke|failure|log)|spawn-options|gateway-readiness|cleanup-boundary|test-cleanup' | Select-Object -Last 80
          } else {
            Write-Warning 'No packaged boundary events file was produced'
          }

      - name: Upload packaged boundary diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: beta38-windows-packaged-boundary-diagnostic-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/beta38-windows-packaged-boundary-diagnostic
            test-results
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
