name: Desktop internal Beta candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact successful-CI Desktop commit SHA
        required: true
        type: string
      ci_run_id:
        description: Successful Desktop CI run ID for source_sha
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: desktop-internal-beta-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact source, CI, and public Beta trust
    runs-on: ubuntu-24.04
    environment: internal-beta
    timeout-minutes: 20
    outputs:
      ci_run_url: ${{ steps.ci.outputs.run_url }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out exact Desktop source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify authoritative release source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          npm run --silent verify:release-source -- \
            --checkout "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            > "$RUNNER_TEMP/release-source.json"
          test -s "$RUNNER_TEMP/release-source.json"

      - name: Validate source and workflow identity
        id: identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = \
            "$GITHUB_REPOSITORY/.github/workflows/internal-beta.yml@refs/heads/main"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1)"
          VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "0.7.4-internal-beta.38"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify successful CI belongs to the exact source
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          gh run view "$CI_RUN_ID" --repo Ablankpaper/aera \
            --json conclusion,headSha,jobs,url,workflowName \
            > "$RUNNER_TEMP/ci-run.json"
          CI_RUN_JSON="$RUNNER_TEMP/ci-run.json" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const run = JSON.parse(await readFile(process.env.CI_RUN_JSON, "utf8"));
          if (run.workflowName !== "CI") throw new Error("Supplied run is not Desktop CI");
          if (run.headSha !== process.env.SOURCE_SHA) throw new Error("CI source SHA differs");
          if (run.conclusion !== "success") throw new Error("CI did not succeed");
          if (!Array.isArray(run.jobs)) throw new Error("CI jobs are missing");
          const requiredJobs = new Set([
            "check (ubuntu-latest)",
            "check (macos-latest)",
            "check (windows-latest)",
            "windows-model-recovery",
          ]);
          const allowedSkippedJobs = new Set([
            "windows-process-tree-diagnostic",
            "windows-managed-gateway-diagnostic",
            "windows-runtime-health-diagnostic",
          ]);
          for (const job of run.jobs) {
            const executed = job.steps?.filter((step) => step.conclusion !== "skipped") ?? [];
            if (
              job.conclusion === "skipped" &&
              executed.length === 0 &&
              allowedSkippedJobs.delete(job.name)
            ) {
              continue;
            }
            if (!requiredJobs.delete(job.name)) {
              throw new Error(`Unexpected CI job: ${job.name}`);
            }
            if (job.conclusion !== "success" || executed.length === 0) {
              throw new Error(`CI job did not execute successfully: ${job.name}`);
            }
          }
          if (requiredJobs.size !== 0) {
            throw new Error(
              `CI platform matrix is incomplete: ${[...requiredJobs].join(", ")}`,
            );
          }
          NODE
          echo "run_url=$(node -p "require('$RUNNER_TEMP/ci-run.json').url")" \
            >> "$GITHUB_OUTPUT"

      - name: Install manifest validator dependencies
        run: npm ci

      - name: Validate protected public Beta trust inputs
        shell: bash
        env:
          BETA_ORIGIN: ${{ vars.AERA_INTERNAL_BETA_ORIGIN }}
          BETA_OFFLINE_KEY_ID: ${{ vars.AERA_INTERNAL_BETA_OFFLINE_KEY_ID }}
          BETA_OFFLINE_PUBLIC_KEY: ${{ vars.AERA_INTERNAL_BETA_OFFLINE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$BETA_ORIGIN"
          test -n "$BETA_OFFLINE_KEY_ID"
          test -n "$BETA_OFFLINE_PUBLIC_KEY"
          node scripts/internal-beta/manifest.mjs trust \
            --origin "$BETA_ORIGIN" \
            --trust-issuer "$BETA_ORIGIN" \
            --offline-key-id "$BETA_OFFLINE_KEY_ID" \
            --offline-public-key "$BETA_OFFLINE_PUBLIC_KEY"
          node --test scripts/internal-beta/*.test.mjs

  macos:
    name: Build, sign, and notarize macOS arm64 internal Beta
    needs: validate
    runs-on: macos-15
    environment: internal-beta
    timeout-minutes: 355
    steps:
      - name: Check out exact Desktop source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require native Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare and verify locked Runtime Seed
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.AERA_CROSS_REPO_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          npm run prepare:runtime-seed -- --platform darwin --arch arm64
          npm run verify:packaged-runtime-seed -- \
            resources/agentera-runtime-seed \
            --desktop-version "${{ needs.validate.outputs.version }}"

      - name: Rebuild native dependencies for arm64
        run: >-
          npx electron-rebuild --force --only better-sqlite3
          --version 41.10.5 --arch arm64 --build-from-source

      - name: Build Desktop with exact Beta origin and trust root
        env:
          VITE_ANALYTICS_BASE_URL: ${{ vars.VITE_ANALYTICS_BASE_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
          MAIN_VITE_HERMES_API_URL: ${{ vars.HERMES_API_URL }}
          MAIN_VITE_HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          MAIN_VITE_AGENTERA_CLOUD_PUBLIC_URL: ${{ vars.AERA_INTERNAL_BETA_ORIGIN }}
          MAIN_VITE_AGENTERA_OFFLINE_PUBLIC_KEYS_JSON: >-
            {"issuer":"${{ vars.AERA_INTERNAL_BETA_ORIGIN }}","keys":[{"keyId":"${{ vars.AERA_INTERNAL_BETA_OFFLINE_KEY_ID }}","publicKey":"${{ vars.AERA_INTERNAL_BETA_OFFLINE_PUBLIC_KEY }}"}]}
        run: |
          set -euo pipefail
          test -n "$MAIN_VITE_AGENTERA_CLOUD_PUBLIC_URL"
          npm run build

      - name: Require signing and notarization credentials
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$ASC_API_KEY_BASE64"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          KEY_DIR="$RUNNER_TEMP/appstore"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          APPLE_API_KEY_PATH="$KEY_PATH" node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";

          const bytes = Buffer.from(process.env.ASC_API_KEY_BASE64, "base64");
          if (!bytes.toString("utf8").includes("BEGIN PRIVATE KEY")) {
            throw new Error("App Store Connect API key is invalid");
          }
          await writeFile(process.env.APPLE_API_KEY_PATH, bytes, {
            flag: "wx",
            mode: 0o600,
          });
          NODE
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Package one Developer-ID-signed macOS app
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: >-
          npx electron-builder
          --config build/electron-builder.internal-beta-macos.yml
          --mac --arm64 --dir --publish never
          -c.forceCodeSigning=true -c.mac.notarize=false

      - name: Resolve and archive the signed app payload
        id: app_paths
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          APP_PATH=$(find dist -maxdepth 3 -type d -name '*.app' -print)
          test -n "$APP_PATH"
          test "$(printf '%s\n' "$APP_PATH" | wc -l | tr -d ' ')" -eq 1
          RUNTIME_MANIFEST=$(find resources/agentera-runtime-seed -maxdepth 1 \
            -type f -name '*.manifest.json' -print)
          test -n "$RUNTIME_MANIFEST"
          test "$(printf '%s\n' "$RUNTIME_MANIFEST" | wc -l | tr -d ' ')" -eq 1
          PAYLOAD_ZIP="$RUNNER_TEMP/Aera-Internal-Beta-$VERSION-app-notarization.zip"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$PAYLOAD_ZIP"
          test -f "$PAYLOAD_ZIP"
          echo "app=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "payload_zip=$PAYLOAD_ZIP" >> "$GITHUB_OUTPUT"
          echo "runtime_manifest=$RUNTIME_MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Submit the signed app payload exactly once
        id: app_notary
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD_ZIP="${{ steps.app_paths.outputs.payload_zip }}"
          SUBMISSION_JSON="$RUNNER_TEMP/app-notarization-submission.json"
          xcrun notarytool submit "$PAYLOAD_ZIP" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --no-wait --output-format json \
            > "$SUBMISSION_JSON"
          APP_SUBMISSION_ID=$(
            NOTARY_JSON="$SUBMISSION_JSON" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const result = JSON.parse(await readFile(process.env.NOTARY_JSON, "utf8"));
          if (typeof result.id !== "string" || result.id.length === 0) {
            throw new Error("App notarization submission ID is missing");
          }
          process.stdout.write(result.id);
          NODE
          )
          echo "submission_id=$APP_SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          echo "::notice title=App notarization submitted::$APP_SUBMISSION_ID"
          preserve="$RUNNER_TEMP/app-notarization-payload"
          mkdir -p "$preserve"
          cp "$PAYLOAD_ZIP" "$SUBMISSION_JSON" "$preserve/"

      - name: Preserve app payload and submission identity before waiting
        uses: actions/upload-artifact@v4
        with:
          name: desktop-internal-beta-app-notary-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/app-notarization-payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Wait for the same app submission and staple the app
        shell: bash
        env:
          APP_SUBMISSION_ID: ${{ steps.app_notary.outputs.submission_id }}
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app_paths.outputs.app }}"
          RESULT_JSON="$RUNNER_TEMP/app-notarization-result.json"
          xcrun notarytool wait "$APP_SUBMISSION_ID" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --timeout 165m --output-format json \
            > "$RESULT_JSON"
          if ! NOTARY_JSON="$RESULT_JSON" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const result = JSON.parse(await readFile(process.env.NOTARY_JSON, "utf8"));
          if (result.status !== "Accepted") {
            throw new Error(`App notarization is ${result.status ?? "unknown"}`);
          }
          NODE
          then
            xcrun notarytool log "$APP_SUBMISSION_ID" \
              --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              "$RUNNER_TEMP/app-notarization-log.json" || true
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Package final DMG and ZIP from the stapled app
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app_paths.outputs.app }}"
          npx electron-builder \
            --config build/electron-builder.internal-beta-macos.yml \
            --prepackaged "$APP_PATH" \
            --mac dmg zip --arm64 --publish never \
            -c.forceCodeSigning=true -c.mac.notarize=false

      - name: Resolve final signed and stapled macOS bytes
        id: mac_paths
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          DMG_PATH="dist/Aera-Internal-Beta-$VERSION-macos-arm64.dmg"
          ZIP_PATH="dist/Aera-Internal-Beta-$VERSION-macos-arm64.zip"
          APP_PATH="${{ steps.app_paths.outputs.app }}"
          test -d "$APP_PATH"
          test -f "$DMG_PATH"
          test -f "$ZIP_PATH"
          hdiutil verify "$DMG_PATH"
          echo "app=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "runtime_manifest=${{ steps.app_paths.outputs.runtime_manifest }}" \
            >> "$GITHUB_OUTPUT"

      - name: Verify exact packaged application startup
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/verify-packaged-startup.mjs \
            --app "${{ steps.mac_paths.outputs.app }}" \
            --platform darwin \
            --architecture arm64 \
            --source-sha "${{ inputs.source_sha }}" \
            --desktop-version "$VERSION" \
            --output "$RUNNER_TEMP/packaged-startup-macos.json"
          test -s "$RUNNER_TEMP/packaged-startup-macos.json"

      - name: Verify live packaged Runtime contract
        id: runtime_contract
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/runtime-contract-diagnostics-macos"
          mkdir -p "$evidence"
          AGENTERA_E2E_EXECUTABLE_PATH="${{ steps.mac_paths.outputs.app }}/Contents/MacOS/Aera" \
          AGENTERA_RUNTIME_SEED_DIR="${{ steps.mac_paths.outputs.app }}/Contents/Resources/agentera-runtime-seed" \
          AGENTERA_E2E_RUNTIME_CONTRACT_OUTPUT="$RUNNER_TEMP/packaged-runtime-contract-macos.json" \
          AGENTERA_E2E_RUNTIME_CONTRACT_DIAGNOSTIC_OUTPUT="$evidence/events.jsonl" \
          AGENTERA_E2E_SOURCE_SHA="${{ inputs.source_sha }}" \
            npx playwright test tests/e2e/agentera-runtime-contract.e2e.ts \
              2>&1 | tee "$evidence/playwright.log"
          test -s "$RUNNER_TEMP/packaged-runtime-contract-macos.json"

      - name: Preserve failed macOS Runtime contract diagnostics
        if: ${{ always() && steps.runtime_contract.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-runtime-contract-diagnostics-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/runtime-contract-diagnostics-macos
            ${{ runner.temp }}/packaged-runtime-contract-macos.json
            test-results
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Record path-free macOS collector identity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/internal-beta/inspect-diagnostic-identity.mjs \
            --app "${{ steps.mac_paths.outputs.app }}" \
            --platform darwin \
            --version "${{ needs.validate.outputs.version }}" \
            --output "$RUNNER_TEMP/diagnostic-macos-identity.json"

      - name: Exercise packaged updater against final macOS ZIP
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BETA_ORIGIN: ${{ vars.AERA_INTERNAL_BETA_ORIGIN }}
        run: >-
          node scripts/internal-beta/verify-packaged-updater-extraction.mjs
          --app "${{ steps.mac_paths.outputs.app }}"
          --zip "${{ steps.mac_paths.outputs.zip }}"
          --desktop-version "$VERSION"
          --expected-cloud-origin "$BETA_ORIGIN"
          --require-runtime-entries

      - name: Submit final DMG and ZIP exactly once
        id: container_notary
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="${{ steps.mac_paths.outputs.dmg }}"
          ZIP_PATH="${{ steps.mac_paths.outputs.zip }}"
          submit() {
            local artifact="$1"
            local output="$2"
            xcrun notarytool submit "$artifact" \
              --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" --no-wait --output-format json \
              > "$output"
          }
          read_id() {
            NOTARY_JSON="$1" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const result = JSON.parse(await readFile(process.env.NOTARY_JSON, "utf8"));
          if (typeof result.id !== "string" || result.id.length === 0) {
            throw new Error("Container notarization submission ID is missing");
          }
          process.stdout.write(result.id);
          NODE
          }
          DMG_SUBMISSION="$RUNNER_TEMP/dmg-notarization-submission.json"
          ZIP_SUBMISSION="$RUNNER_TEMP/zip-notarization-submission.json"
          submit "$DMG_PATH" "$DMG_SUBMISSION"
          submit "$ZIP_PATH" "$ZIP_SUBMISSION"
          DMG_SUBMISSION_ID=$(read_id "$DMG_SUBMISSION")
          ZIP_SUBMISSION_ID=$(read_id "$ZIP_SUBMISSION")
          echo "dmg_submission_id=$DMG_SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          echo "zip_submission_id=$ZIP_SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          echo "::notice title=DMG notarization submitted::$DMG_SUBMISSION_ID"
          echo "::notice title=ZIP notarization submitted::$ZIP_SUBMISSION_ID"
          preserve="$RUNNER_TEMP/container-notarization-payload"
          mkdir -p "$preserve"
          cp "$DMG_PATH" "$ZIP_PATH" "$DMG_SUBMISSION" "$ZIP_SUBMISSION" \
            "$preserve/"

      - name: Preserve final containers and submission identities before waiting
        uses: actions/upload-artifact@v4
        with:
          name: desktop-internal-beta-container-notary-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/container-notarization-payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Wait for the same final submissions and staple the DMG
        shell: bash
        env:
          DMG_SUBMISSION_ID: ${{ steps.container_notary.outputs.dmg_submission_id }}
          ZIP_SUBMISSION_ID: ${{ steps.container_notary.outputs.zip_submission_id }}
        run: |
          set -euo pipefail
          DMG_PATH="${{ steps.mac_paths.outputs.dmg }}"
          ZIP_PATH="${{ steps.mac_paths.outputs.zip }}"
          DMG_RESULT="$RUNNER_TEMP/dmg-notarization-result.json"
          ZIP_RESULT="$RUNNER_TEMP/zip-notarization-result.json"
          wait_for_submission() {
            local submission_id="$1"
            local output="$2"
            xcrun notarytool wait "$submission_id" \
              --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" --timeout 165m --output-format json \
              > "$output"
          }
          wait_for_submission "$DMG_SUBMISSION_ID" "$DMG_RESULT" &
          DMG_WAIT_PID=$!
          wait_for_submission "$ZIP_SUBMISSION_ID" "$ZIP_RESULT" &
          ZIP_WAIT_PID=$!
          wait_status=0
          wait "$DMG_WAIT_PID" || wait_status=1
          wait "$ZIP_WAIT_PID" || wait_status=1
          if (( wait_status != 0 )); then
            xcrun notarytool log "$DMG_SUBMISSION_ID" \
              --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              "$RUNNER_TEMP/dmg-notarization-log.json" || true
            xcrun notarytool log "$ZIP_SUBMISSION_ID" \
              --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              "$RUNNER_TEMP/zip-notarization-log.json" || true
            exit 1
          fi
          DMG_PATH="$DMG_PATH" ZIP_PATH="$ZIP_PATH" \
          DMG_RESULT="$DMG_RESULT" ZIP_RESULT="$ZIP_RESULT" \
          NOTARIZATION_OUTPUT="$RUNNER_TEMP/notarizations.json" \
            node --input-type=module <<'NODE'
          import { basename } from "node:path";
          import { readFile, writeFile } from "node:fs/promises";
          import { canonicalJSONStringify } from "./scripts/release/candidate-manifest.mjs";

          const read = async (path) => JSON.parse(await readFile(path, "utf8"));
          const dmg = await read(process.env.DMG_RESULT);
          const zip = await read(process.env.ZIP_RESULT);
          for (const result of [dmg, zip]) {
            if (result.status !== "Accepted" || typeof result.id !== "string") {
              throw new Error("Apple container notarization was not accepted");
            }
          }
          await writeFile(
            process.env.NOTARIZATION_OUTPUT,
            canonicalJSONStringify({
              notarizations: [
                { artifact: basename(process.env.DMG_PATH), id: dmg.id, status: dmg.status },
                { artifact: basename(process.env.ZIP_PATH), id: zip.id, status: zip.status },
              ],
            }),
            { flag: "wx", mode: 0o600 },
          );
          NODE
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Verify signed and notarized macOS candidate
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/verify-macos.mjs \
            --app "${{ steps.mac_paths.outputs.app }}" \
            --dmg "${{ steps.mac_paths.outputs.dmg }}" \
            --zip "${{ steps.mac_paths.outputs.zip }}" \
            --runtime-seed-reference resources/agentera-runtime-seed \
            --runtime-seed-manifest "${{ steps.mac_paths.outputs.runtime_manifest }}" \
            --desktop-version "$VERSION" \
            --notarization-evidence "$RUNNER_TEMP/notarizations.json" \
            --output "$RUNNER_TEMP/macos-evidence.json"

      - name: Bind native inventories to final macOS containers
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/final-artifact-native-inventory.mjs \
            --artifact "${{ steps.mac_paths.outputs.dmg }}" \
            --kind macos_dmg \
            --platform darwin \
            --architecture arm64 \
            --source-sha "${{ inputs.source_sha }}" \
            --desktop-version "$VERSION" \
            --output "$RUNNER_TEMP/native-inventory-macos-dmg.json"
          node scripts/release/final-artifact-native-inventory.mjs \
            --artifact "${{ steps.mac_paths.outputs.zip }}" \
            --kind macos_zip \
            --platform darwin \
            --architecture arm64 \
            --source-sha "${{ inputs.source_sha }}" \
            --desktop-version "$VERSION" \
            --output "$RUNNER_TEMP/native-inventory-macos-zip.json"

      - name: Preserve non-secret notarization diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-internal-beta-notary-diagnostics-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/*notarization-*.json
            ${{ runner.temp }}/app-notarization-payload
            ${{ runner.temp }}/container-notarization-payload
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0

      - name: Stage signed immutable macOS bytes and evidence
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/internal-beta-macos"
          mkdir -p "$destination/artifacts" "$destination/evidence" \
            "$destination/runtime-seed"
          cp "${{ steps.mac_paths.outputs.dmg }}" "$destination/artifacts/"
          cp "${{ steps.mac_paths.outputs.zip }}" "$destination/artifacts/"
          cp "$RUNNER_TEMP/macos-evidence.json" "$destination/evidence/"
          cp "$RUNNER_TEMP/packaged-startup-macos.json" \
            "$destination/evidence/"
          cp "$RUNNER_TEMP/packaged-runtime-contract-macos.json" \
            "$destination/evidence/"
          cp "$RUNNER_TEMP/diagnostic-macos-identity.json" \
            "$destination/evidence/"
          cp "$RUNNER_TEMP/native-inventory-macos-dmg.json" \
            "$RUNNER_TEMP/native-inventory-macos-zip.json" \
            "$destination/evidence/"
          cp "${{ steps.mac_paths.outputs.runtime_manifest }}" \
            "$destination/runtime-seed/"

      - name: Upload macOS internal-Beta bytes
        uses: actions/upload-artifact@v4
        with:
          name: desktop-internal-beta-macos-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/internal-beta-macos
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    name: Build unsigned Windows x64 internal Beta
    needs: validate
    runs-on: windows-2025
    environment: internal-beta
    timeout-minutes: 90
    steps:
      - name: Check out exact Desktop source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require native Windows x64 runner
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Windows internal-Beta runner is not native x64"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare and verify locked Runtime Seed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.AERA_CROSS_REPO_READ_TOKEN || github.token }}
        run: |
          npm run prepare:runtime-seed -- --platform windows --arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:packaged-runtime-seed -- `
            resources/agentera-runtime-seed `
            --desktop-version "${{ needs.validate.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rebuild native dependencies for x64
        run: npx electron-builder install-app-deps --arch=x64

      - name: Build Desktop with exact Beta origin and trust root
        env:
          VITE_ANALYTICS_BASE_URL: ${{ vars.VITE_ANALYTICS_BASE_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
          MAIN_VITE_HERMES_API_URL: ${{ vars.HERMES_API_URL }}
          MAIN_VITE_HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          MAIN_VITE_AGENTERA_CLOUD_PUBLIC_URL: ${{ vars.AERA_INTERNAL_BETA_ORIGIN }}
          MAIN_VITE_AGENTERA_OFFLINE_PUBLIC_KEYS_JSON: >-
            {"issuer":"${{ vars.AERA_INTERNAL_BETA_ORIGIN }}","keys":[{"keyId":"${{ vars.AERA_INTERNAL_BETA_OFFLINE_KEY_ID }}","publicKey":"${{ vars.AERA_INTERNAL_BETA_OFFLINE_PUBLIC_KEY }}"}]}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MAIN_VITE_AGENTERA_CLOUD_PUBLIC_URL)) {
            throw "Internal Beta Cloud origin is missing"
          }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package unsigned Windows setup, portable, and app ZIP payload
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder `
            --config build/electron-builder.internal-beta.yml `
            --win nsis portable dir --x64 --publish never `
            --config.forceCodeSigning=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact packaged application startup
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $unpacked = @(Get-ChildItem dist -Directory | Where-Object { $_.Name -like "*unpacked" })
          if ($unpacked.Count -ne 1) { throw "Expected exactly one unpacked Windows app" }
          $output = Join-Path $env:RUNNER_TEMP "packaged-startup-windows.json"
          node scripts/release/verify-packaged-startup.mjs `
            --app $unpacked[0].FullName `
            --platform win32 `
            --architecture x64 `
            --source-sha "${{ inputs.source_sha }}" `
            --desktop-version $env:VERSION `
            --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw "Packaged Windows startup evidence is missing"
          }

      - name: Verify live packaged Runtime contract
        id: runtime_contract
        shell: pwsh
        run: |
          $unpacked = @(Get-ChildItem dist -Directory | Where-Object { $_.Name -like "*unpacked" })
          if ($unpacked.Count -ne 1) { throw "Expected exactly one unpacked Windows app" }
          $evidence = Join-Path $env:RUNNER_TEMP "runtime-contract-diagnostics"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $env:AGENTERA_E2E_EXECUTABLE_PATH = Join-Path $unpacked[0].FullName "Aera.exe"
          $env:AGENTERA_RUNTIME_SEED_DIR = Join-Path $unpacked[0].FullName "resources/agentera-runtime-seed"
          $env:AGENTERA_E2E_RUNTIME_CONTRACT_OUTPUT = Join-Path $env:RUNNER_TEMP "packaged-runtime-contract-windows.json"
          $env:AGENTERA_E2E_RUNTIME_CONTRACT_DIAGNOSTIC_OUTPUT = Join-Path $evidence "events.jsonl"
          $env:AGENTERA_RUNTIME_INVENTORY_DIAGNOSTIC_OUTPUT = Join-Path $evidence "inventory-events.jsonl"
          $env:AGENTERA_E2E_SOURCE_SHA = "${{ inputs.source_sha }}"
          npx playwright test tests/e2e/agentera-runtime-contract.e2e.ts 2>&1 | `
            Tee-Object -FilePath (Join-Path $evidence "playwright.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $env:AGENTERA_E2E_RUNTIME_CONTRACT_OUTPUT -PathType Leaf)) {
            throw "Packaged Windows Runtime contract evidence is missing"
          }

      - name: Preserve failed Windows Runtime contract diagnostics
        if: ${{ always() && steps.runtime_contract.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-contract-diagnostics-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/runtime-contract-diagnostics
            ${{ runner.temp }}/packaged-runtime-contract-windows.json
            test-results
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Record path-free Windows collector identity
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $unpacked = @(Get-ChildItem dist -Directory | Where-Object { $_.Name -like "*unpacked" })
          if ($unpacked.Count -ne 1) { throw "Expected exactly one unpacked Windows app" }
          node scripts/internal-beta/inspect-diagnostic-identity.mjs `
            --app $unpacked[0].FullName `
            --platform win32 `
            --version $env:VERSION `
            --application-id com.bignormal.agentera.studio `
            --output "$env:RUNNER_TEMP/diagnostic-windows-identity.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged Runtime Seed, app ZIP, and stage immutable bytes
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BETA_ORIGIN: ${{ vars.AERA_INTERNAL_BETA_ORIGIN }}
        run: |
          $unpacked = @(Get-ChildItem dist -Directory | Where-Object { $_.Name -like "*unpacked" })
          if ($unpacked.Count -ne 1) { throw "Expected exactly one unpacked Windows app" }
          $packagedSeed = Join-Path $unpacked[0].FullName "resources/agentera-runtime-seed"
          npm run verify:packaged-runtime-seed -- `
            $packagedSeed `
            --reference-dir resources/agentera-runtime-seed `
            --desktop-version $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $appZipName = "Aera-Internal-Beta-$env:VERSION-windows-x64-app.zip"
          $appZip = Join-Path "dist" $appZipName
          if (Test-Path -LiteralPath $appZip) {
            Remove-Item -LiteralPath $appZip -Force
          }
          Compress-Archive `
            -Path (Join-Path $unpacked[0].FullName "*") `
            -DestinationPath $appZip `
            -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $appZip -PathType Leaf)) {
            throw "Windows app ZIP was not created"
          }
          node scripts/internal-beta/verify-packaged-windows-app-zip.mjs `
            --zip $appZip `
            --desktop-version $env:VERSION `
            --expected-cloud-origin $env:BETA_ORIGIN `
            --runtime-seed-reference resources/agentera-runtime-seed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $destination = Join-Path $env:RUNNER_TEMP "internal-beta-windows"
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $destination "artifacts"), `
            (Join-Path $destination "evidence"), `
            (Join-Path $destination "runtime-seed") | Out-Null
          $names = @(
            "Aera-Internal-Beta-$env:VERSION-windows-x64-setup.exe",
            "Aera-Internal-Beta-$env:VERSION-windows-x64-portable.exe",
            $appZipName
          )
          foreach ($name in $names) {
            $source = Join-Path "dist" $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing expected internal-Beta artifact: $name"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $destination "artifacts")
          }
          $manifests = @(Get-ChildItem resources/agentera-runtime-seed -File -Filter "*.manifest.json")
          if ($manifests.Count -ne 1) { throw "Expected one Runtime Seed manifest" }
          Copy-Item $manifests[0].FullName -Destination (Join-Path $destination "runtime-seed")
          Copy-Item `
            (Join-Path $env:RUNNER_TEMP "packaged-startup-windows.json") `
            -Destination (Join-Path $destination "evidence")
          Copy-Item `
            (Join-Path $env:RUNNER_TEMP "packaged-runtime-contract-windows.json") `
            -Destination (Join-Path $destination "evidence")
          Copy-Item `
            (Join-Path $env:RUNNER_TEMP "diagnostic-windows-identity.json") `
            -Destination (Join-Path $destination "evidence")

      - name: Bind native inventories to final Windows containers
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $artifacts = @(
            @{
              Name = "Aera-Internal-Beta-$env:VERSION-windows-x64-setup.exe"
              Kind = "windows_setup"
              Output = "native-inventory-windows-setup.json"
            },
            @{
              Name = "Aera-Internal-Beta-$env:VERSION-windows-x64-portable.exe"
              Kind = "windows_portable"
              Output = "native-inventory-windows-portable.json"
            },
            @{
              Name = "Aera-Internal-Beta-$env:VERSION-windows-x64-app.zip"
              Kind = "windows_app_zip"
              Output = "native-inventory-windows-app-zip.json"
            }
          )
          foreach ($artifact in $artifacts) {
            node scripts/release/final-artifact-native-inventory.mjs `
              --artifact (Join-Path "dist" $artifact.Name) `
              --kind $artifact.Kind `
              --platform win32 `
              --architecture x64 `
              --source-sha "${{ inputs.source_sha }}" `
              --desktop-version $env:VERSION `
              --output (Join-Path $env:RUNNER_TEMP $artifact.Output)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $destination = Join-Path $env:RUNNER_TEMP "internal-beta-windows/evidence"
          Copy-Item (Join-Path $env:RUNNER_TEMP "native-inventory-windows-*.json") `
            -Destination $destination

      - name: Verify explicitly unsigned Windows candidate
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $manifests = @(Get-ChildItem resources/agentera-runtime-seed -File -Filter "*.manifest.json")
          if ($manifests.Count -ne 1) { throw "Expected one Windows Runtime Seed manifest" }
          ./scripts/release/verify-windows.ps1 `
            -DistDirectory "dist" `
            -RuntimeSeedReference "resources/agentera-runtime-seed" `
            -RuntimeSeedManifest $manifests[0].FullName `
            -DesktopVersion $env:VERSION `
            -SetupArtifactName "Aera-Internal-Beta-$env:VERSION-windows-x64-setup.exe" `
            -PortableArtifactName "Aera-Internal-Beta-$env:VERSION-windows-x64-portable.exe" `
            -SigningMode unsigned_internal_beta `
            -Output "$env:RUNNER_TEMP/windows-evidence.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/windows-evidence.json" `
            -Destination "$env:RUNNER_TEMP/internal-beta-windows/evidence"

      - name: Exercise Windows install/start/update/rollback smoke
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          HELPER_OUTPUT: ${{ runner.temp }}\windows-update-helper.ps1
        run: |
          $unpacked = @(Get-ChildItem dist -Directory | Where-Object { $_.Name -like "*unpacked" })
          if ($unpacked.Count -ne 1) { throw "Expected exactly one unpacked Windows app" }
          $setup = Join-Path "dist" "Aera-Internal-Beta-$env:VERSION-windows-x64-setup.exe"
          $portable = Join-Path "dist" "Aera-Internal-Beta-$env:VERSION-windows-x64-portable.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "Windows setup artifact is missing" }
          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) { throw "Windows portable artifact is missing" }
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; import { buildWindowsUpdateHelperScript } from './out/main/internal-beta-updater.js'; writeFileSync(process.env.HELPER_OUTPUT, buildWindowsUpdateHelperScript({ processWaitAttempts: 300, healthyWaitAttempts: 300 }), 'utf8');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $env:HELPER_OUTPUT -PathType Leaf)) { throw "Compiled Windows helper was not generated" }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File scripts/internal-beta/windows-update-smoke.ps1 `
            -AppDirectory $unpacked[0].FullName `
            -SetupPath $setup `
            -PortablePath $portable `
            -Version $env:VERSION `
            -HelperScript $env:HELPER_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows internal-Beta bytes
        uses: actions/upload-artifact@v4
        with:
          name: desktop-internal-beta-windows-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/internal-beta-windows
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  assemble:
    name: Assemble and sign immutable internal Beta candidate
    needs: [validate, macos, windows]
    runs-on: ubuntu-24.04
    environment: internal-beta
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out exact Desktop source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go for exact supply-chain tools
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Download macOS internal-Beta bytes
        uses: actions/download-artifact@v4
        with:
          name: desktop-internal-beta-macos-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/internal-beta-macos

      - name: Download Windows internal-Beta bytes
        uses: actions/download-artifact@v4
        with:
          name: desktop-internal-beta-windows-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/internal-beta-windows

      - name: Assemble exact package and Runtime evidence
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p candidate/artifacts candidate/evidence candidate/runtime-seed
          for name in \
            "Aera-Internal-Beta-$VERSION-macos-arm64.dmg" \
            "Aera-Internal-Beta-$VERSION-macos-arm64.zip"
          do
            source="$RUNNER_TEMP/internal-beta-macos/artifacts/$name"
            test -f "$source"
            cp "$source" "candidate/artifacts/$name"
          done
          for name in \
            "Aera-Internal-Beta-$VERSION-windows-x64-setup.exe" \
            "Aera-Internal-Beta-$VERSION-windows-x64-portable.exe" \
            "Aera-Internal-Beta-$VERSION-windows-x64-app.zip"
          do
            source="$RUNNER_TEMP/internal-beta-windows/artifacts/$name"
            test -f "$source"
            cp "$source" "candidate/artifacts/$name"
          done
          mac_manifests=("$RUNNER_TEMP"/internal-beta-macos/runtime-seed/*.manifest.json)
          windows_manifests=("$RUNNER_TEMP"/internal-beta-windows/runtime-seed/*.manifest.json)
          test "${#mac_manifests[@]}" -eq 1
          test "${#windows_manifests[@]}" -eq 1
          cp "${mac_manifests[0]}" "${windows_manifests[0]}" candidate/runtime-seed/
          test -f "$RUNNER_TEMP/internal-beta-macos/evidence/macos-evidence.json"
          cp "$RUNNER_TEMP/internal-beta-macos/evidence/macos-evidence.json" \
            candidate/evidence/
          test -f "$RUNNER_TEMP/internal-beta-macos/evidence/packaged-startup-macos.json"
          test -f "$RUNNER_TEMP/internal-beta-windows/evidence/packaged-startup-windows.json"
          cp "$RUNNER_TEMP/internal-beta-macos/evidence/packaged-startup-macos.json" \
            "$RUNNER_TEMP/internal-beta-windows/evidence/packaged-startup-windows.json" \
            candidate/evidence/
          test -f "$RUNNER_TEMP/internal-beta-macos/evidence/packaged-runtime-contract-macos.json"
          test -f "$RUNNER_TEMP/internal-beta-windows/evidence/packaged-runtime-contract-windows.json"
          cp "$RUNNER_TEMP/internal-beta-macos/evidence/packaged-runtime-contract-macos.json" \
            "$RUNNER_TEMP/internal-beta-windows/evidence/packaged-runtime-contract-windows.json" \
            candidate/evidence/
          test -f "$RUNNER_TEMP/internal-beta-windows/evidence/windows-evidence.json"
          cp "$RUNNER_TEMP/internal-beta-windows/evidence/windows-evidence.json" \
            candidate/evidence/
          for name in \
            native-inventory-macos-dmg.json \
            native-inventory-macos-zip.json \
            native-inventory-windows-setup.json \
            native-inventory-windows-portable.json \
            native-inventory-windows-app-zip.json
          do
            source=$(find "$RUNNER_TEMP/internal-beta-macos/evidence" \
              "$RUNNER_TEMP/internal-beta-windows/evidence" -name "$name" -print)
            test -f "$source"
            cp "$source" candidate/evidence/
          done
          cp build/agentera-runtime-seed.lock.json \
            candidate/evidence/agentera-runtime-seed.lock.json
          cp "$RUNNER_TEMP/internal-beta-macos/evidence/diagnostic-macos-identity.json" \
            candidate/evidence/
          cp "$RUNNER_TEMP/internal-beta-windows/evidence/diagnostic-windows-identity.json" \
            candidate/evidence/

      - name: Install exact Cosign and Syft versions
        shell: bash
        run: |
          set -euo pipefail
          tool_bin="$RUNNER_TEMP/internal-beta-tools"
          mkdir -p "$tool_bin"
          GOBIN="$tool_bin" \
            go install github.com/sigstore/cosign/v3/cmd/cosign@v3.0.6
          GOBIN="$tool_bin" \
            go install github.com/anchore/syft/cmd/syft@v1.44.0
          echo "$tool_bin" >> "$GITHUB_PATH"

      - name: Generate SPDX SBOM and SLSA v1 provenance
        shell: bash
        env:
          BETA_ORIGIN: ${{ vars.AERA_INTERNAL_BETA_ORIGIN }}
          BETA_OFFLINE_KEY_ID: ${{ vars.AERA_INTERNAL_BETA_OFFLINE_KEY_ID }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          CREATED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "CREATED_AT=$CREATED_AT" >> "$GITHUB_ENV"
          syft dir:. \
            --exclude './candidate/**' \
            --exclude './.git/**' \
            -o spdx-json=candidate/evidence/internal-beta.spdx.json
          node scripts/internal-beta/manifest.mjs provenance \
            --artifacts-dir candidate/artifacts \
            --runtime-lock build/agentera-runtime-seed.lock.json \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION" \
            --origin "$BETA_ORIGIN" \
            --offline-key-id "$BETA_OFFLINE_KEY_ID" \
            --build-run-url "$BUILD_RUN_URL" \
            --created-at "$CREATED_AT" \
            --output candidate/evidence/internal-beta.provenance.json

      - name: Build and verify signed Desktop update metadata
        shell: bash
        env:
          BETA_ORIGIN: ${{ vars.AERA_INTERNAL_BETA_ORIGIN }}
          DESKTOP_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.AERA_DESKTOP_UPDATE_SIGNING_PRIVATE_KEY }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$DESKTOP_UPDATE_SIGNING_PRIVATE_KEY"
          mkdir -p candidate/desktop-update
          base_url="$BETA_ORIGIN/desktop-updates/internal-beta"
          node scripts/internal-beta/desktop-update.mjs build \
            --artifacts-dir candidate/artifacts \
            --base-url "$base_url" \
            --manifest candidate/desktop-update/manifest.json \
            --private-key-env DESKTOP_UPDATE_SIGNING_PRIVATE_KEY \
            --published-at "$CREATED_AT" \
            --release-notes "Beta.38 更新 AgentEra Runtime 至 0.20.0-agentera.5，修复请求级模型路由与工具策略能力协商、移除请求中的 API Key，并修复模型切换后的 Gateway 重启端口复用和界面焦点时序问题。保留 Beta.37 的 Profile staging 隔离、Beta.36 的智能体能力优先界面与会话级模型切换、Beta.35 的默认模型和智能体模型选择修复、Beta.34 的首次登录/模型发现/更新状态修复、Beta.33 的模型配置可靠性修复。Beta.29 故障机使用 DMG 桥接安装，Beta.31/Beta.32/Beta.33/Beta.34/Beta.35/Beta.36/Beta.37 支持在线升级。macOS 内测包已签名并公证；Windows 内测包未进行 Authenticode 签名，仅供受控内测使用。" \
            --signature candidate/desktop-update/manifest.sig \
            --version "$VERSION"
          node scripts/internal-beta/desktop-update.mjs verify \
            --artifacts-dir candidate/artifacts \
            --base-url "$base_url" \
            --manifest candidate/desktop-update/manifest.json \
            --public-key build/desktop-update-signing-public.pem \
            --signature candidate/desktop-update/manifest.sig \
            --version "$VERSION"

      - name: Build and byte-verify canonical internal-Beta manifest
        shell: bash
        env:
          BETA_ORIGIN: ${{ vars.AERA_INTERNAL_BETA_ORIGIN }}
          BETA_OFFLINE_KEY_ID: ${{ vars.AERA_INTERNAL_BETA_OFFLINE_KEY_ID }}
          BETA_OFFLINE_PUBLIC_KEY: ${{ vars.AERA_INTERNAL_BETA_OFFLINE_PUBLIC_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
          CI_RUN_URL: ${{ needs.validate.outputs.ci_run_url }}
          BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          common_args=(
            --artifacts-dir candidate/artifacts
            --build-run-url "$BUILD_RUN_URL"
            --ci-run-url "$CI_RUN_URL"
            --created-at "$CREATED_AT"
            --macos-evidence candidate/evidence/macos-evidence.json
            --native-evidence-dir candidate/evidence
            --offline-key-id "$BETA_OFFLINE_KEY_ID"
            --offline-public-key "$BETA_OFFLINE_PUBLIC_KEY"
            --origin "$BETA_ORIGIN"
            --package-json package.json
            --provenance candidate/evidence/internal-beta.provenance.json
            --repository Ablankpaper/aera
            --runtime-lock build/agentera-runtime-seed.lock.json
            --runtime-manifests-dir candidate/runtime-seed
            --sbom candidate/evidence/internal-beta.spdx.json
            --source-sha "$SOURCE_SHA"
            --trust-issuer "$BETA_ORIGIN"
            --version "$VERSION"
            --windows-evidence candidate/evidence/windows-evidence.json
          )
          node scripts/internal-beta/manifest.mjs build \
            "${common_args[@]}" \
            --output candidate/internal-beta-manifest.json
          node scripts/internal-beta/manifest.mjs verify \
            "${common_args[@]}" \
            --manifest candidate/internal-beta-manifest.json

      - name: Package candidate-bound external diagnostic collectors
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("candidate/internal-beta-manifest.json", "utf8"));
          const mac = manifest.artifacts.find((entry) => entry.platform === "macos" && entry.kind === "zip");
          const windows = manifest.artifacts.find((entry) => entry.platform === "windows" && entry.kind === "app_zip");
          if (!mac || !windows) throw new Error("collector target artifact is missing");
          await writeFile(`${process.env.RUNNER_TEMP}/macos-artifact.json`, JSON.stringify({ sha256: mac.sha256 }));
          await writeFile(`${process.env.RUNNER_TEMP}/windows-artifact.json`, JSON.stringify({ sha256: windows.sha256 }));
          NODE
          mkdir -p candidate/diagnostic-collectors
          node scripts/internal-beta/package-diagnostic-collectors.mjs \
            --manifest candidate/internal-beta-manifest.json \
            --macos-identity candidate/evidence/diagnostic-macos-identity.json \
            --macos-startup candidate/evidence/packaged-startup-macos.json \
            --macos-artifact "$RUNNER_TEMP/macos-artifact.json" \
            --windows-identity candidate/evidence/diagnostic-windows-identity.json \
            --windows-startup candidate/evidence/packaged-startup-windows.json \
            --windows-artifact "$RUNNER_TEMP/windows-artifact.json" \
            --output candidate/diagnostic-collectors \
            --ledger candidate/evidence/diagnostic-collectors.json

      - name: Keyless-sign and verify manifest and provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = \
            "$GITHUB_REPOSITORY/.github/workflows/internal-beta.yml@refs/heads/main"
          cosign sign-blob --yes \
            --bundle candidate/evidence/internal-beta-provenance.cosign.bundle.json \
            candidate/evidence/internal-beta.provenance.json
          cosign sign-blob --yes \
            --bundle candidate/evidence/internal-beta-manifest.cosign.bundle.json \
            candidate/internal-beta-manifest.json

          identity="^https://github\\.com/Ablankpaper/aera/\\.github/workflows/internal-beta\\.yml@refs/heads/main$"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify-blob \
            --bundle candidate/evidence/internal-beta-provenance.cosign.bundle.json \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" \
            candidate/evidence/internal-beta.provenance.json
          cosign verify-blob \
            --bundle candidate/evidence/internal-beta-manifest.cosign.bundle.json \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" \
            candidate/internal-beta-manifest.json

      - name: Record immutable SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd candidate
            find artifacts desktop-update evidence runtime-seed diagnostic-collectors -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum
            sha256sum internal-beta-manifest.json
          ) > candidate/SHA256SUMS
          test "$(wc -l < candidate/SHA256SUMS | tr -d ' ')" -ge 13

      - name: Upload one immutable 30-day internal-Beta candidate
        uses: actions/upload-artifact@v4
        with:
          name: desktop-internal-beta-${{ inputs.source_sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
