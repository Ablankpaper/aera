appId: com.bignormal.agentera.studio
productName: Aera
protocols:
  - name: Aera Invitation
    schemes:
      - aera
      - agentera
directories:
  buildResources: build
files:
  - "out/**/*"
  - "package.json"
  - "resources/icon.png"
  - "resources/agentera-runtime-trust.json"
  - "!resources/agentera-runtime-seed/**"
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/build/Release/*.node
extraResources:
  - from: resources/agentera-runtime-seed
    to: agentera-runtime-seed
    filter:
      - "**/*"
      - "!.gitkeep"
win:
  executableName: Aera
  icon: build/icon.ico
  target:
    - nsis
    - portable
portable:
  artifactName: Aera-${version}-portable.${ext}
nsis:
  artifactName: Aera-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: true
  perMachine: false
mac:
  artifactName: Aera-${version}-${arch}-${os}.${ext}
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
dmg:
  artifactName: Aera-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: Aera
  vendor: Aera
  category: Utility
  synopsis: Private AI agent desktop
  description: >-
    Aera is a native desktop app for installing, configuring, and chatting
    with Aera Runtime.
appImage:
  artifactName: Aera-${version}.${ext}
deb:
  # Run chmod 4755 on chrome-sandbox so Electron's setuid sandbox helper
  # works on modern Linux distros that disable unprivileged user
  # namespaces (Ubuntu 24.04+, etc.). Closes #395.
  afterInstall: build/linux-after-install.sh
rpm:
  artifactName: Aera-${version}.${ext}
  # Same SUID fix for .rpm consumers (Fedora 40+ also restricts userns).
  afterInstall: build/linux-after-install.sh
npmRebuild: false
publish:
  provider: github
  owner: Ablankpaper
  repo: aera
