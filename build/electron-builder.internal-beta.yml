extends: electron-builder.yml

# Windows internal-only packages and explicit local rehearsals remain unsigned.
# The Windows workflow also sets CSC_IDENTITY_AUTO_DISCOVERY=false. The signed
# macOS workflow uses electron-builder.internal-beta-macos.yml instead.
forceCodeSigning: false
publish: []

mac:
  identity: null
  notarize: false
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: Aera-Internal-Beta-${version}-macos-${arch}.${ext}

dmg:
  artifactName: Aera-Internal-Beta-${version}-macos-${arch}.${ext}

nsis:
  artifactName: Aera-Internal-Beta-${version}-windows-${arch}-setup.${ext}

portable:
  artifactName: Aera-Internal-Beta-${version}-windows-${arch}-portable.${ext}
