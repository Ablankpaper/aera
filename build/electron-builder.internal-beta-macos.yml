extends: electron-builder.yml
beforePack: scripts/internal-beta/verify-built-auth-config.mjs

# This configuration is used only after the workflow has required protected
# Developer ID credentials. The workflow performs explicit two-round Apple
# notarization around a prepackaged app, so electron-builder must not submit a
# hidden duplicate request or fall back to ad-hoc signing.
forceCodeSigning: true
publish: []

mac:
  notarize: false
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: Aera-Internal-Beta-${version}-macos-${arch}.${ext}

dmg:
  artifactName: Aera-Internal-Beta-${version}-macos-${arch}.${ext}
